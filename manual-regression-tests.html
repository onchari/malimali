<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manual Regression Test Suite - Mandela General Stores</title>
    <style>
      :root {
        --bg: #f4f7f5;
        --card: #ffffff;
        --text: #1f2a37;
        --muted: #5d6b7a;
        --line: #dfe7e3;
        --green: #176b4d;
        --green-soft: #eaf7f1;
        --amber: #d97706;
        --amber-soft: #fff4df;
        --red: #b42318;
        --red-soft: #fff0f0;
        --blue: #0f5db7;
        --blue-soft: #edf4ff;
        --purple: #6b4ec4;
        --purple-soft: #f3eeff;
        --shadow: 0 10px 30px rgba(20, 31, 22, 0.06);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: linear-gradient(135deg, #0d4d34, #1b7a52);
        color: #fff;
        box-shadow: var(--shadow);
      }

      .topbar-inner {
        max-width: 1500px;
        margin: 0 auto;
        padding: 18px 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(1.8rem, 2vw + 1rem, 3rem);
      }
      .subhead {
        font-size: 0.95rem;
        opacity: 0.9;
      }

      .container {
        max-width: 1500px;
        margin: 0 auto;
        padding: 24px 20px 50px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin: 22px 0 26px;
      }

      .metric {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 16px 18px;
      }
      .metric-label {
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .metric-value {
        font-size: 2rem;
        font-weight: 800;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 20px;
      }

      .filter-btn {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 700;
      }
      .filter-btn.active {
        background: var(--green);
        color: #fff;
        border-color: var(--green);
      }

      .search-wrap {
        margin: 10px 0 22px;
      }
      .search-wrap input {
        width: min(100%, 420px);
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        font-size: 1rem;
      }

      .tests {
        display: grid;
        gap: 18px;
      }

      .test-card {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 8px solid #9aa7a0;
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 18px;
        transition: background-color 0.18s ease, border-color 0.18s ease;
      }
      .test-card.result-pass {
        background: #d9f5e5;
        border-color: #38a169;
      }
      .test-card.result-blocked {
        background: #dbeafe;
        border-color: #3b82f6;
      }
      .test-card.result-fail {
        background: #fee2e2;
        border-color: #ef4444;
      }
      .test-card.result-skipped {
        background: #f1f5f9;
        border-color: #94a3b8;
      }
      .test-card[data-priority="critical"] { border-left-color: var(--red); }
      .test-card[data-priority="major"] { border-left-color: var(--amber); }
      .test-card[data-priority="medium"] { border-left-color: var(--blue); }
      .test-card[data-priority="minor"] { border-left-color: var(--purple); }
      .test-card[data-priority="cosmetics"] { border-left-color: #7f8c8d; }

      .test-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .id-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .test-id {
        font-weight: 800;
        color: var(--green);
        font-size: 1.02rem;
      }

      .priority {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 6px 10px;
      }
      .priority.critical { background: var(--red-soft); color: var(--red); }
      .priority.major { background: var(--amber-soft); color: var(--amber); }
      .priority.medium { background: var(--blue-soft); color: var(--blue); }
      .priority.minor { background: var(--purple-soft); color: var(--purple); }
      .priority.cosmetics { background: #eef2f4; color: #4a5565; }

      .test-title {
        font-size: 1.15rem;
        font-weight: 800;
        margin: 8px 0 12px;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 8px;
      }

      .field-box {
        background: #f8faf9;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .field-label {
        display: block;
        font-weight: 800;
        font-size: 0.76rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 7px;
      }
      .field-box p, .field-box ul {
        margin: 0;
        color: var(--text);
      }
      .field-box ul {
        padding-left: 18px;
      }

      textarea, input[type="text"], select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }

      .result-row {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 14px;
      }

      .attachment-section {
        margin-top: 14px;
        background: #fbfcfb;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .attachment-section input[type="file"] {
        padding: 8px;
        background: #fff;
      }

      .status-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .status-btn {
        font-size: 0.82rem;
        padding: 9px 15px;
        font-weight: 800;
        border-radius: 999px;
        border: 2px solid transparent;
        cursor: pointer;
        background: #fff;
      }
      .status-btn[data-status="pass"] { color: var(--green); border-color: var(--green); }
      .status-btn[data-status="blocked"] { color: var(--blue); border-color: var(--blue); }
      .status-btn[data-status="fail"] { color: var(--red); border-color: var(--red); }
      .status-btn[data-status="skipped"] { color: var(--muted); border-color: #94a3b8; }
      .status-btn.clear-status-btn { color: var(--muted); border-color: var(--line); }
      .status-btn.clear-status-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status-btn.selected[data-status="pass"] { background: var(--green); color: #fff; }
      .status-btn.selected[data-status="blocked"] { background: var(--blue); color: #fff; }
      .status-btn.selected[data-status="fail"] { background: var(--red); color: #fff; }
      .status-btn.selected[data-status="skipped"] { background: #64748b; color: #fff; }
      .issue-draft-note {
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .issue-draft-link {
        display: inline-block;
        margin-top: 5px;
        color: var(--blue);
        font-weight: 800;
      }

      .pagination {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin: 14px 0;
      }
      .pagination button {
        min-width: 110px;
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
      }
      .pagination button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .pagination .skip-btn {
        min-width: 90px;
        border-color: #64748b;
        color: #475569;
      }
      .pagination .skip-btn:hover:not(:disabled) {
        background: #f1f5f9;
      }
      .page-indicator {
        color: var(--muted);
        font-weight: 800;
        text-align: center;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 20px 0 12px;
      }

      .toolbar button {
        background: var(--green);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-weight: 800;
        cursor: pointer;
      }

      .status-tabs {
        display: flex;
        gap: 10px;
        margin: 0 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .status-tab {
        padding: 10px 14px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .status-tab.active {
        color: var(--green);
        border-bottom-color: var(--green);
      }

      .footer-note {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 18px;
      }

      @media (max-width: 700px) {
        .container { padding: 18px 14px 42px; }
        .test-card { padding: 14px; }
        .toolbar { align-items: stretch; }
        .toolbar button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1>Manual Regression Test Suite</h1>
        <div class="subhead">Mandela General Stores — End-to-end user workflow validation</div>
      </div>
    </header>

    <main class="container">
      <div class="summary-grid" id="summary"></div>

      <div class="toolbar">
        <div style="font-weight:700; color: var(--muted);">Filter by priority</div>
        <button type="button" id="resetAll">Reset all results</button>
      </div>

      <div class="filters" id="filters"></div>
      <div class="status-tabs" role="tablist" aria-label="Test case status">
        <button type="button" class="status-tab active" id="allTestsTab" role="tab" aria-selected="true">All test cases</button>
        <button type="button" class="status-tab" id="skippedTestsTab" role="tab" aria-selected="false">Skipped (0)</button>
      </div>
      <div class="search-wrap">
        <input id="searchInput" type="text" placeholder="Search by ID, title, objective or module..." />
      </div>

      <nav class="pagination" aria-label="Test case pages">
        <button type="button" id="previousTest">← Previous</button>
        <span class="page-indicator" id="pageIndicator" aria-live="polite"></span>
        <button type="button" class="skip-btn" id="skipTest">Skip</button>
        <button type="button" id="nextTest">Next →</button>
      </nav>
      <section id="testList" class="tests"></section>
      <nav class="pagination" aria-label="Test case pages">
        <button type="button" id="previousTestBottom">← Previous</button>
        <span class="page-indicator" id="pageIndicatorBottom" aria-live="polite"></span>
        <button type="button" class="skip-btn" id="skipTestBottom">Skip</button>
        <button type="button" id="nextTestBottom">Next →</button>
      </nav>
      <div class="footer-note">
        This interactive checklist is meant for manual QA execution. Capture actual results, attach supporting files, and document defects in the field provided per case.
      </div>
    </main>

    <script>
      const priorities = ["critical", "major", "medium", "minor", "cosmetics"];
      const tests = [
        {
          id: "MGS-001",
          title: "Login with valid credentials",
          module: "Authentication",
          priority: "critical",
          objective: "Confirm the user can access the application with a valid username and PIN.",
          steps: [
            "Open the app in the browser.",
            "Enter a valid username and PIN from the allowed list.",
            "Tap Sign In.",
            "Observe landing page and role-specific access."
          ],
          expected: "The app loads the correct dashboard or allowed default page without any error. The user session starts successfully."
        },
        {
          id: "MGS-002",
          title: "Login with invalid credentials",
          module: "Authentication",
          priority: "critical",
          objective: "Verify failed login attempts are rejected securely and do not grant access.",
          steps: [
            "Try a wrong username and correct PIN.",
            "Try a valid username and wrong PIN.",
            "Try both incorrect."
          ],
          expected: "The system shows an error message, keeps the user on the login screen, and does not open any protected page."
        },
        {
          id: "MGS-003",
          title: "Session restore after browser refresh",
          module: "Authentication",
          priority: "major",
          objective: "Check that an authenticated session is restored correctly when the page reloads.",
          steps: [
            "Log in successfully.",
            "Refresh the page.",
            "Observe the app state and session expiry behavior."
          ],
          expected: "The user remains signed in within the configured session window. The app restores the user context and last page if valid."
        },
        {
          id: "MGS-004",
          title: "Session expiry and logout flow",
          module: "Authentication",
          priority: "major",
          objective: "Ensure the session expires or logs out safely when it should.",
          steps: [
            "Sign in and leave the app idle for longer than the session timeout window.",
            "Refresh or return to the app.",
            "Attempt to access protected functionality."
          ],
          expected: "The system logs out cleanly, removes session state, and redirects to login without leaving protected data accessible."
        },
        {
          id: "MGS-005",
          title: "Role-based tab restriction",
          module: "Access Control",
          priority: "critical",
          objective: "Validate that users only see allowed tabs and screens based on their role.",
          steps: [
            "Sign in as super user.",
            "Sign in as regular user.",
            "Sign in as clerk."
          ],
          expected: "Each user only sees permitted tabs and actions. Hidden functions remain inaccessible."
        },
        {
          id: "MGS-006",
          title: "Logout from the user menu",
          module: "Authentication",
          priority: "major",
          objective: "Ensure the user can sign out cleanly from the UI.",
          steps: [
            "Log in successfully.",
            "Open the user menu.",
            "Choose Sign Out."
          ],
          expected: "The app clears the session and returns to the login screen or secure startup state."
        },
        {
          id: "MGS-007",
          title: "Dashboard loads key KPIs",
          module: "Dashboard",
          priority: "major",
          objective: "Verify the dashboard calculates and displays summary KPIs accurately.",
          steps: [
            "Sign in and open the dashboard.",
            "Review sales, profit, stock, and summary cards."
          ],
          expected: "The dashboard shows current totals and correct business metrics for available records."
        },
        {
          id: "MGS-008",
          title: "Global search finds item by name, code, or type",
          module: "Dashboard",
          priority: "major",
          objective: "Confirm search is functional and returns relevant results.",
          steps: [
            "Open the dashboard search field.",
            "Search by item name.",
            "Search by code.",
            "Search by item type or category."
          ],
          expected: "Relevant records are returned with matching attributes. Empty results are handled gracefully."
        },
        {
          id: "MGS-009",
          title: "No results search handling",
          module: "Dashboard",
          priority: "minor",
          objective: "Check search UX when nothing matches.",
          steps: [
            "Search for a value that does not exist."
          ],
          expected: "The app clearly indicates no results and does not break or show stale data."
        },
        {
          id: "MGS-010",
          title: "Add new standard item",
          module: "Inventory",
          priority: "critical",
          objective: "Validate creation of a basic stock item.",
          steps: [
            "Open Inventory > Add.",
            "Enter a unique code and valid item details.",
            "Save the item."
          ],
          expected: "The item is saved successfully, displayed in stock, and visible in the inventory list."
        },
        {
          id: "MGS-011",
          title: "Add duplicate item code",
          module: "Inventory",
          priority: "critical",
          objective: "Ensure duplicate product codes are rejected or handled safely.",
          steps: [
            "Attempt to save an item with an already-used code."
          ],
          expected: "The app blocks duplicate creation and shows a clear validation message."
        },
        {
          id: "MGS-012",
          title: "Add item with missing required fields",
          module: "Inventory",
          priority: "critical",
          objective: "Confirm required field validation works.",
          steps: [
            "Leave a mandatory field blank.",
            "Try to save the item."
          ],
          expected: "Input validation blocks save and tells the user which fields are required."
        },
        {
          id: "MGS-013",
          title: "Add item with zero or negative stock values",
          module: "Inventory",
          priority: "major",
          objective: "Verify the app rejects invalid stock values for standard items.",
          steps: [
            "Attempt to create an item with quantity 0, negative number, or invalid formatting."
          ],
          expected: "The system rejects invalid values or applies the defined policy consistently and prompts the user."
        },
        {
          id: "MGS-014",
          title: "Add footwear item with sizes",
          module: "Inventory",
          priority: "critical",
          objective: "Test shoe inventory flows with multiple size rows.",
          steps: [
            "Open the footwear form.",
            "Add a shoe SKU with several sizes.",
            "Save the record."
          ],
          expected: "Each shoe size is persisted correctly and totals reflect the combined stock accurately."
        },
        {
          id: "MGS-015",
          title: "Add item with photo attachment",
          module: "Inventory",
          priority: "major",
          objective: "Validate photo upload during item creation.",
          steps: [
            "Add a new item.",
            "Attach an image.",
            "Save the item."
          ],
          expected: "The image is stored and displays in the item details or stock list without breaking the form."
        },
        {
          id: "MGS-016",
          title: "Edit existing item details",
          module: "Inventory",
          priority: "major",
          objective: "Ensure existing inventory records can be updated without data loss.",
          steps: [
            "Open an existing product record.",
            "Change its category to a different active non-footwear category and edit another field.",
            "Save the change."
          ],
          expected: "The selected category and other edits are saved and reflected in the stock list and category filters; the item code remains unchanged."
        },
        {
          id: "MGS-017",
          title: "Delete item from inventory",
          module: "Inventory",
          priority: "major",
          objective: "Confirm item deletion is intentional and safe.",
          steps: [
            "Open an item detail sheet.",
            "Choose delete/remove.",
            "Confirm the action."
          ],
          expected: "The item is removed from stock and no orphaned references remain in the inventory list or sales history."
        },
        {
          id: "MGS-018",
          title: "View item stock details and quantity",
          module: "Inventory",
          priority: "major",
          objective: "Check product details show accurate stock count.",
          steps: [
            "Open the stock list.",
            "Select an item to view detail."
          ],
          expected: "The UI displays the correct available stock and relevant metadata."
        },
        {
          id: "MGS-019",
          title: "Sell a standard item",
          module: "Sales",
          priority: "critical",
          objective: "Confirm the sale flow updates stock and records revenue.",
          steps: [
            "Open an item with stock.",
            "Select Sell.",
            "Enter a valid quantity and confirm sale."
          ],
          expected: "Stock decreases by the sold quantity. The sale is recorded and appears in sales history."
        },
        {
          id: "MGS-020",
          title: "Sell qty greater than available stock",
          module: "Sales",
          priority: "critical",
          objective: "Ensure the app prevents overselling.",
          steps: [
            "Try to sell more units than are in stock."
          ],
          expected: "Validation blocks the transaction and shows a clear error without deducting any stock."
        },
        {
          id: "MGS-021",
          title: "Sell record-only item",
          module: "Sales",
          priority: "major",
          objective: "Verify record-only items are sold without reducing stock quantities.",
          steps: [
            "Choose an item flagged as record-only.",
            "Complete a sale."
          ],
          expected: "The sale is logged, while stock is not deducted."
        },
        {
          id: "MGS-022",
          title: "Sell a footwear item by size",
          module: "Sales",
          priority: "critical",
          objective: "Validate shoe sales reduce only the selected size quantity.",
          steps: [
            "Open a shoe product.",
            "Sell one size row.",
            "Confirm."
          ],
          expected: "Only the selected size stock count decreases and the total reflects the correct remaining stock."
        },
        {
          id: "MGS-023",
          title: "Edit a sale after it is recorded",
          module: "Sales",
          priority: "major",
          objective: "Check that sale editing is consistent and does not corrupt totals.",
          steps: [
            "Capture a sale, including one linked to an item with a buy price of zero.",
            "Open the sales history.",
            "Edit the sale quantity, price, or payment method."
          ],
          expected: "The zero-cost sale can be edited; the updated sale reflects new values, and totals reconcile correctly."
        },
        {
          id: "MGS-024",
          title: "Void a sale",
          module: "Sales",
          priority: "critical",
          objective: "Confirm deletion/voiding a sale resets the affected stock and history accurately.",
          steps: [
            "Complete a sale.",
            "Void the sale.",
            "Check stock and dashboard totals."
          ],
          expected: "The sale is removed from history and related stock is restored without side effects."
        },
        {
          id: "MGS-025",
          title: "Sales history filters and date range",
          module: "Sales",
          priority: "major",
          objective: "Verify correct filtering and display of sales records across time periods.",
          steps: [
            "Open sales history.",
            "Use custom date filters and other selectors.",
            "Review the list and totals.",
            "Verify Today displays its transactions and summary by default.",
            "Select Last Month and verify it uses the previous calendar month.",
            "Open a date in a multi-day range, then use Back and Home."
          ],
          expected: "Sales History defaults to today's transactions with no Back button. This Week includes Sunday through today; Last Week includes the previous Sunday through Saturday; Last Month is the previous calendar month. Multi-day overviews show collapsed daily rows and a period total row with transactions, items, buy cost, sale amount, and profit. Opening a date shows only its transactions and totals. Back restores the previous filter/view; Home resets to Today and clears custom dates. Empty periods show a zero summary and a clear message; load failures offer Retry."
        },
        {
          id: "MGS-026",
          title: "Open business day",
          module: "Operations",
          priority: "critical",
          objective: "Validate day management for daily operations.",
          steps: [
            "Open the Operations section.",
            "Create or open a business day."
          ],
          expected: "The business day opens cleanly and displays active state."
        },
        {
          id: "MGS-027",
          title: "Close business day with reconciliation",
          module: "Operations",
          priority: "critical",
          objective: "Ensure closing a day records the reconciliation flow correctly.",
          steps: [
            "Open a day.",
            "Enter closing values and reconcile.",
            "Close the day."
          ],
          expected: "The day transitions to CLOSED/LOCKED as per system rules without losing recorded values."
        },
        {
          id: "MGS-028",
          title: "Lock day after historical close",
          module: "Operations",
          priority: "major",
          objective: "Confirm locked days cannot be edited.",
          steps: [
            "Lock a business day.",
            "Attempt edits or new transactions against it."
          ],
          expected: "The app blocks modification and shows the appropriate message or disabled state."
        },
        {

      const summaryEl = document.getElementById('summary');
      const filtersEl = document.getElementById('filters');
      const testListEl = document.getElementById('testList');
      const searchInput = document.getElementById('searchInput');
      const resultStorageKey = 'mgs-manual-regression-results-v1';
      let testResults = {};
      try {
        testResults = JSON.parse(localStorage.getItem(resultStorageKey) || '{}');
      } catch (error) {
        console.warn('Saved regression results could not be loaded.', error);
      }
      const attachedFiles = new Map();

      let activePriority = 'all';
      let activeStatusTab = 'all';
      let currentPage = 0;

      function saveResults() {
        try {
          localStorage.setItem(resultStorageKey, JSON.stringify(testResults));
        } catch (error) {
          console.error('Regression results could not be saved.', error);
        }
      }

      function getFilteredTests() {
        const query = searchInput.value.trim().toLowerCase();
        return tests.filter((test) => {
          const matchesPriority = activePriority === 'all' || test.priority === activePriority;
          const matchesStatus =
            activeStatusTab === 'all' ||
            testResults[test.id]?.status === 'skipped';
          const haystack = `${test.id} ${test.title} ${test.module} ${test.objective}`.toLowerCase();
          const matchesSearch = !query || haystack.includes(query);
          return matchesPriority && matchesStatus && matchesSearch;
        });
      }

      function renderSummary() {
        const counts = priorities.reduce((acc, pr) => {
          acc[pr] = tests.filter((test) => test.priority === pr).length;
          return acc;
        }, {});

        const cards = [
          { label: 'Total tests', value: tests.length },
          {
            label: 'Completed',
            value: `${tests.filter((test) => ['pass', 'blocked', 'fail'].includes(testResults[test.id]?.status)).length} / ${tests.length}`
          },
          {
            label: 'Skipped',
            value: tests.filter((test) => testResults[test.id]?.status === 'skipped').length
          },
          { label: 'Critical', value: counts.critical },
          { label: 'Major', value: counts.major },
          { label: 'Medium', value: counts.medium },
          { label: 'Minor', value: counts.minor },
          { label: 'Cosmetics', value: counts.cosmetics }
        ];

        summaryEl.innerHTML = cards.map((card) => `
          <div class="metric">
            <div class="metric-label">${card.label}</div>
            <div class="metric-value">${card.value}</div>
          </div>
        `).join('');
      }

      function renderStatusTabs() {
        const skippedCount = tests.filter(
          (test) => testResults[test.id]?.status === 'skipped',
        ).length;
        const allTab = document.getElementById('allTestsTab');
        const skippedTab = document.getElementById('skippedTestsTab');
        skippedTab.textContent = `Skipped (${skippedCount})`;
        allTab.classList.toggle('active', activeStatusTab === 'all');
        skippedTab.classList.toggle('active', activeStatusTab === 'skipped');
        allTab.setAttribute('aria-selected', String(activeStatusTab === 'all'));
        skippedTab.setAttribute('aria-selected', String(activeStatusTab === 'skipped'));
      }

      function renderFilters() {
        const filterOptions = ['all', ...priorities];
        filtersEl.innerHTML = filterOptions.map((pr) => `
          <button class="filter-btn ${activePriority === pr ? 'active' : ''}" data-priority="${pr}">
            ${pr === 'all' ? 'All' : pr.charAt(0).toUpperCase() + pr.slice(1)}
          </button>
        `).join('');
      }

      function buildIssueDraftUrl(test, result, files) {
        const title = `[Manual Regression] ${test.id}: ${test.title}`;
        const evidence = files.length
          ? `\n\nSelected evidence files (attach them to the issue before submitting):\n${files.map((file) => `- ${file.name}`).join('\n')}`
          : '';
        const body = [
          `## Failed manual regression test: ${test.id}`,
          '',
          `**Title:** ${test.title}`,
          `**Priority:** ${test.priority.toUpperCase()}`,
          `**Module:** ${test.module}`,
          '',
          '**Objective**',
          test.objective,
          '',
          '**Steps to reproduce**',
          ...test.steps.map((step, index) => `${index + 1}. ${step}`),
          '',
          '**Expected result**',
          test.expected,
          '',
          '**Actual result**',
          result.actual?.trim() || '(No actual result entered yet.)',
          evidence,
          '',
          '> This issue was prepared from the manual regression test page. Review and submit it on GitHub.'
        ].join('\n');
        const params = new URLSearchParams({ title, body });
        return `https://github.com/onchari/malimali/issues/new?${params.toString()}`;
      }

      function buildTestSummary(test) {
        const module = test.module.toLowerCase();
        let extraCheck =
          'Check the screen or record named in this test to make sure the result is clear, saved where needed, and does not change anything unrelated.';

        if (module.includes('security') || module.includes('access control')) {
          extraCheck =
            'Check that only the right user can do this. A user without permission must not be able to make the change.';
        } else if (module.includes('authentication')) {
          extraCheck =
            'Check that the right user signs in, sees only the pages they are allowed to use, and can sign out safely.';
        } else if (module.includes('customer')) {
          extraCheck = test.title.toLowerCase().includes('creat')
            ? 'Check that the new customer appears in the customer list with the correct name and phone number. A blank name must not create a record.'
            : 'Check that the customer history shows the right transaction and that the balance matches it.';
        } else if (module.includes('sales')) {
          extraCheck =
            'Check that the sale appears once in the sales history, the totals are correct, and stock changes only when it should.';
        } else if (module.includes('inventory')) {
          extraCheck =
            'Check that the item shows the right category, price, and quantity in the stock list, and that other items stay unchanged.';
        } else if (module.includes('finance')) {
          extraCheck =
            'Check that the entry appears once in the finance list and is counted in the right total.';
        } else if (module.includes('operations')) {
          extraCheck =
            'Check that the result is saved for the correct business day and that a locked day cannot be changed.';
        } else if (module.includes('sync')) {
          extraCheck =
            'Check that the latest changes appear on other devices using the same environment after syncing, without missing or repeated records. Development and Production data must stay separate.';
        } else if (module.includes('wishlist')) {
          extraCheck =
            'Check that the right item appears in the right list with the correct status and budget, without creating a duplicate.';
        } else if (module.includes('dashboard')) {
          extraCheck =
            'Check that the figures match the saved records and the selected date range.';
        } else if (module.includes('settings')) {
          extraCheck =
            'Check that the setting is still saved after you reopen the app and that it changes only the feature it controls.';
        } else if (module.includes('ai assistant')) {
          extraCheck =
            'Check that the answer matches the question and available shop data. Shop records should not change unless you choose an action that changes them.';
        } else if (module.includes('pwa')) {
          extraCheck =
            'Check that the app still opens and works as described after a refresh or when offline, where that applies.';
        } else if (module.includes('notification')) {
          extraCheck =
            'Check that the alert is easy to understand, appears at the right time, and can be dismissed without changing shop records.';
        } else if (
          module.includes('accessibility') ||
          module.includes('ui polish') ||
          module.includes('general ux')
        ) {
          extraCheck =
            'Check that the page is easy to read and use, and that buttons and messages behave as expected on the tested screen size or input method.';
        }

        return `Expected result in more detail: ${test.expected} ${extraCheck}`;
      }

      function renderTests() {
        const filtered = getFilteredTests();
        const maxPage = Math.max(0, filtered.length - 1);
        currentPage = Math.min(currentPage, maxPage);
        const pageTest = filtered[currentPage];
        const pageIndicator = filtered.length
          ? `Test ${currentPage + 1} of ${filtered.length}`
          : 'No test cases';
        ['pageIndicator', 'pageIndicatorBottom'].forEach((id) => {
          document.getElementById(id).textContent = pageIndicator;
        });
        ['previousTest', 'previousTestBottom'].forEach((id) => {
          document.getElementById(id).disabled = currentPage === 0;
        });
        ['nextTest', 'nextTestBottom'].forEach((id) => {
          document.getElementById(id).disabled =
            filtered.length === 0 || currentPage >= maxPage;
        });
        ['skipTest', 'skipTestBottom'].forEach((id) => {
          document.getElementById(id).disabled =
            filtered.length === 0 ||
            activeStatusTab !== 'all' ||
            pageTest?.id == null ||
            testResults[pageTest.id]?.status === 'skipped';
        });

        if (!filtered.length) {
          const emptyMessage =
            activeStatusTab === 'skipped'
              ? 'No test cases have been skipped yet.'
              : 'No matching test cases found.';
          testListEl.innerHTML = `<div class="test-card"><div class="test-title">${emptyMessage}</div></div>`;
          return;
        }

        const result = testResults[pageTest.id] || {};
        const files = attachedFiles.get(pageTest.id) || [];
        const issueDraftUrl = result.status === 'fail'
          ? buildIssueDraftUrl(pageTest, result, files)
          : '';
        testListEl.innerHTML = `
          <article class="test-card ${result.status ? `result-${result.status}` : ''}" data-priority="${pageTest.priority}">
            <div class="test-header">
              <div class="id-row">
                <span class="test-id">${pageTest.id}</span>
                <span class="priority ${pageTest.priority}">${pageTest.priority}</span>
              </div>
              <span style="font-size: 0.8rem; color: var(--muted); font-weight: 700;">${pageTest.module}</span>
            </div>

            <div class="test-title">${pageTest.title}</div>

            <div class="info-grid">
              <div class="field-box" style="grid-column: 1 / -1;">
                <span class="field-label">Expected Result - More Detail</span>
                <p>${buildTestSummary(pageTest)}</p>
              </div>
              <div class="field-box">
                <span class="field-label">What This Test Checks</span>
                <p>${pageTest.objective}</p>
              </div>
              <div class="field-box">
                <span class="field-label">What to Do</span>
                <ul>
                  ${pageTest.steps.map((step) => `<li>${step}</li>`).join('')}
                </ul>
              </div>
              <div class="field-box" style="grid-column: 1 / -1;">
                <span class="field-label">What Should Happen</span>
                <p>${pageTest.expected}</p>
              </div>
            </div>

            <div class="result-row">
              <div class="field-box">
                <span class="field-label">What Happened</span>
                <textarea data-role="actual-result" placeholder="Describe the observed outcome, screenshots, issues, or defects found."></textarea>
              </div>
              <div class="field-box">
                <span class="field-label">Status</span>
                <div class="status-row">
                  <button type="button" class="status-btn" data-status="pass" aria-pressed="${result.status === 'pass'}">PASS</button>
                  <button type="button" class="status-btn" data-status="blocked" aria-pressed="${result.status === 'blocked'}">BLOCKED</button>
                  <button type="button" class="status-btn" data-status="fail" aria-pressed="${result.status === 'fail'}">FAIL</button>
                  <button type="button" class="status-btn" data-status="skipped" aria-pressed="${result.status === 'skipped'}">SKIPPED</button>
                  <button type="button" class="status-btn clear-status-btn" data-role="clear-status" ${result.status ? '' : 'disabled'}>Clear status</button>
                </div>
                <div class="issue-draft-note" data-role="issue-draft-note" ${result.status === 'fail' ? '' : 'hidden'}>
                  A GitHub issue draft was opened. Review it and submit on GitHub; attachments are not uploaded automatically.
                  <a class="issue-draft-link" data-role="issue-draft-link" href="${issueDraftUrl}" target="_blank" rel="noopener noreferrer">Open GitHub issue draft</a>
                </div>
              </div>
            </div>

            <div class="attachment-section">
              <div class="field-label">Attach document, video, or picture</div>
              <input type="file" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.mp4,.mov,.avi,.webm,.gif" data-role="attachment" />
              <div style="margin-top: 10px; font-size: 0.82rem; color: var(--muted);" data-role="attachment-summary"></div>
            </div>
          </article>
        `;

        testListEl.querySelectorAll('.status-btn[data-status]').forEach((button) => {
          const selected = button.dataset.status === result.status;
          button.classList.toggle('selected', selected);
          button.addEventListener('click', () => {
            const nextStatus = button.dataset.status;
            const openingFail = nextStatus === 'fail' && result.status !== 'fail';
            const actualResult = testListEl.querySelector('[data-role="actual-result"]');
            result.actual = actualResult.value;
            result.status = nextStatus;
            testResults[pageTest.id] = result;
            saveResults();
            renderSummary();
            renderStatusTabs();
            if (openingFail) {
              const issueUrl = buildIssueDraftUrl(
                pageTest,
                result,
                attachedFiles.get(pageTest.id) || [],
              );
              window.open(issueUrl, '_blank', 'noopener,noreferrer');
            }
            renderTests();
          });
        });

        testListEl.querySelector('[data-role="clear-status"]').addEventListener('click', () => {
          const actualResult = testListEl.querySelector('[data-role="actual-result"]');
          result.actual = actualResult.value;
          delete result.status;
          if (!result.actual) delete testResults[pageTest.id];
          else testResults[pageTest.id] = result;
          saveResults();
          renderSummary();
          renderStatusTabs();
          renderTests();
        });

        const actualResult = testListEl.querySelector('[data-role="actual-result"]');
        actualResult.value = result.actual || '';
        actualResult.addEventListener('input', () => {
          result.actual = actualResult.value;
          testResults[pageTest.id] = result;
          saveResults();
          if (result.status === 'fail') {
            const issueLink = testListEl.querySelector('[data-role="issue-draft-link"]');
            if (issueLink) {
              issueLink.href = buildIssueDraftUrl(
                pageTest,
                result,
                attachedFiles.get(pageTest.id) || [],
              );
            }
          }
        });
        const attachmentSummary = testListEl.querySelector('[data-role="attachment-summary"]');
        attachmentSummary.textContent = files.length
          ? files.map((file) => file.name).join(', ')
          : 'No file attached';

        document.querySelectorAll('[data-role="attachment"]').forEach((input) => {
          input.addEventListener('change', (event) => {
            const selectedFiles = Array.from(event.target.files || []);
            attachedFiles.set(pageTest.id, selectedFiles);
            const summary = event.target.parentElement.querySelector('[data-role="attachment-summary"]');
            summary.textContent = selectedFiles.length
              ? selectedFiles.map((file) => file.name).join(', ')
              : 'No file attached';
            if (result.status === 'fail') {
              const issueLink = testListEl.querySelector('[data-role="issue-draft-link"]');
              if (issueLink) {
                issueLink.href = buildIssueDraftUrl(pageTest, result, selectedFiles);
              }
            }
          });
        });
      }

      function movePage(direction) {
        const count = getFilteredTests().length;
        currentPage = Math.max(0, Math.min(currentPage + direction, count - 1));
        renderTests();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function skipCurrentTest() {
        const filtered = getFilteredTests();
        const pageTest = filtered[currentPage];
        if (!pageTest || activeStatusTab !== 'all') return;
        const result = testResults[pageTest.id] || {};
        const actualResult = testListEl.querySelector('[data-role="actual-result"]');
        if (actualResult) result.actual = actualResult.value;
        result.status = 'skipped';
        testResults[pageTest.id] = result;
        saveResults();
        renderSummary();
        renderStatusTabs();
        currentPage = Math.min(currentPage + 1, Math.max(0, filtered.length - 1));
        renderTests();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      document.getElementById('previousTest').addEventListener('click', () => movePage(-1));
      document.getElementById('previousTestBottom').addEventListener('click', () => movePage(-1));
      document.getElementById('nextTest').addEventListener('click', () => movePage(1));
      document.getElementById('nextTestBottom').addEventListener('click', () => movePage(1));
      document.getElementById('skipTest').addEventListener('click', skipCurrentTest);
      document.getElementById('skipTestBottom').addEventListener('click', skipCurrentTest);

      document.getElementById('allTestsTab').addEventListener('click', () => {
        activeStatusTab = 'all';
        currentPage = 0;
        renderStatusTabs();
        renderTests();
      });
      document.getElementById('skippedTestsTab').addEventListener('click', () => {
        activeStatusTab = 'skipped';
        currentPage = 0;
        renderStatusTabs();
        renderTests();
      });

      filtersEl.addEventListener('click', (event) => {
        const btn = event.target.closest('.filter-btn');
        if (!btn) return;
        activePriority = btn.dataset.priority;
        currentPage = 0;
        renderFilters();
        renderTests();
      });

      searchInput.addEventListener('input', () => {
        currentPage = 0;
        renderTests();
      });

      document.getElementById('resetAll').addEventListener('click', () => {
        if (!window.confirm('Reset all test statuses and actual results?')) return;
        Object.keys(testResults).forEach((id) => delete testResults[id]);
        attachedFiles.clear();
        try {
          localStorage.removeItem(resultStorageKey);
        } catch (error) {
          console.error('Saved regression results could not be cleared.', error);
        }
        renderSummary();
        renderStatusTabs();
        renderTests();
      });

      renderSummary();
      renderFilters();
      renderStatusTabs();
      renderTests();
    </script>
  </body>
</html>
